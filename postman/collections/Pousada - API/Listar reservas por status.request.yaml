$kind: http-request
url: "{{baseUrl}}/reservas?status=Em%20andamento"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Retorna uma lista', () => pm.expect(pm.response.json()).to.be.an('array'));
      pm.test('Todas as reservas têm o status filtrado', () => {
          pm.response.json().forEach(r => {
              pm.expect(r.status.toLowerCase().startsWith('em andamento')).to.be.true;
          });
      });
    language: text/javascript
order: 1100
