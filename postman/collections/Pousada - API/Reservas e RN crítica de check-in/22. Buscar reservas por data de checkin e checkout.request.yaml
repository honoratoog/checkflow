$kind: http-request
url: "{{baseUrl}}/reservas?checkin=2026-11-20&checkout=2026-11-25"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Retorna reservas com datas correspondentes', () => {
          pm.expect(body).to.be.an('array');
          body.forEach(r => {
              pm.expect(r.data_checkin).to.include('2026-11-20');
              pm.expect(r.data_checkout).to.include('2026-11-25');
          });
      });
    language: text/javascript
order: 22000
