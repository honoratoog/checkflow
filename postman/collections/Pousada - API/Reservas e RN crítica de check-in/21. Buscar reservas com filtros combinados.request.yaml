$kind: http-request
url: "{{baseUrl}}/reservas?quarto={{numeroQuarto}}&hospede={{nomeHospede}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Retorna lista filtrada combinando quarto e hóspede', () => {
          pm.expect(body).to.be.an('array');
          body.forEach(r => {
              pm.expect(r.quarto_numero).to.include(pm.collectionVariables.get('numeroQuarto'));
              pm.expect(r.hospede_nome.toLowerCase()).to.include(pm.collectionVariables.get('nomeHospede').toLowerCase());
          });
      });
    language: text/javascript
order: 21000
