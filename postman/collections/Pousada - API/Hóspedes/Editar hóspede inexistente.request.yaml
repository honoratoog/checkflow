$kind: http-request
url: "{{baseUrl}}/hospedes/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Inexistente",
      "documento": "99999999999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Mensagem de erro esperada', () => {
          pm.expect(pm.response.json().error).to.eql('Hóspede não encontrado');
      });
    language: text/javascript
order: 3820
