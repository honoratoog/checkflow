$kind: http-request
url: "{{baseUrl}}/hospedes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Maria Silva",
      "documento": "{{documentoHospede}}",
      "telefone": "47999990000"
    }
scripts:
  - type: beforeRequest
    code: |-
      function gerarCpfValido() {
          const digits = Array.from({ length: 9 }, () => Math.floor(Math.random() * 9));
          let s = 0;
          for (let i = 0; i < 9; i++) s += digits[i] * (10 - i);
          let r = (s * 10) % 11;
          const d1 = r === 10 || r === 11 ? 0 : r;
          s = 0;
          for (let i = 0; i < 9; i++) s += digits[i] * (11 - i);
          s += d1 * 2;
          r = (s * 10) % 11;
          const d2 = r === 10 || r === 11 ? 0 : r;
          return [...digits, d1, d2].join('');
      }
      pm.collectionVariables.set('documentoHospede', gerarCpfValido());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Retorna o hóspede criado', () => {
          pm.expect(body.documento).to.eql(pm.collectionVariables.get('documentoHospede'));
      });
      pm.collectionVariables.set('hospedeId', body.id);
    language: text/javascript
order: 1000
