$kind: http-request
url: "{{baseUrl}}/hospedes/{{hospedeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "",
      "documento": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Mensagem de validação de campos obrigatórios', () => {
          pm.expect(pm.response.json().error).to.eql('Informe nome e documento do hóspede');
      });
    language: text/javascript
order: 3840
