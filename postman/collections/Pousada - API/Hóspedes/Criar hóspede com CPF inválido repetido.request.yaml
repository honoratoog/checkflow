$kind: http-request
url: "{{baseUrl}}/hospedes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Hóspede CPF Repetido",
      "documento": "111.111.111-11"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Erro de CPF inválido por sequência repetida', () => {
          pm.expect(pm.response.json().error).to.eql('CPF inválido');
      });
    language: text/javascript
order: 2100
