$kind: http-request
url: "{{baseUrl}}/hospedes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Hóspede RG Curto Demais",
      "documento": "12",
      "tipo_documento": "RG"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Erro de validação para RG inválido', () => {
          pm.expect(pm.response.json().error).to.eql('RG inválido');
      });
    language: text/javascript
order: 2400
