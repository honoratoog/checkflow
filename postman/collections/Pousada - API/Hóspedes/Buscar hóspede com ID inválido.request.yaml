$kind: http-request
url: "{{baseUrl}}/hospedes/invalido"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Retorna mensagem de erro de ID', () => {
          pm.expect(pm.response.json().error).to.include('ID');
      });
    language: text/javascript
order: 3600
