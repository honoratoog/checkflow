$kind: http-request
url: "{{baseUrl}}/quartos?status=livre"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Retorna uma lista', () => pm.expect(pm.response.json()).to.be.an('array'));
      pm.test('Todos os quartos filtrados possuem status correspondente', () => {
          const quartos = pm.response.json();
          quartos.forEach(q => {
              pm.expect(q.status.toLowerCase()).to.include('livre');
          });
      });
    language: text/javascript
order: 4600
