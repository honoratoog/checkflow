$kind: http-request
url: "{{baseUrl}}/quartos/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "numero": "999999",
      "tipo": "Solteiro"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Mensagem de erro esperada', () => {
          pm.expect(pm.response.json().error).to.eql('Quarto não encontrado');
      });
    language: text/javascript
order: 4360
