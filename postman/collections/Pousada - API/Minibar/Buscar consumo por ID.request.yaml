$kind: http-request
url: "{{baseUrl}}/consumos/{{consumoMinibarId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Retorna o consumo solicitado', () => {
          pm.expect(body.id).to.eql(pm.collectionVariables.get('consumoMinibarId'));
          pm.expect(body).to.have.property('item');
          pm.expect(body).to.have.property('quantidade');
          pm.expect(body).to.have.property('valor_unitario');
      });
    language: text/javascript
order: 8501
