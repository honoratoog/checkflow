$kind: http-request
url: "{{baseUrl}}/consumos/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Mensagem de ID numérico', () => {
          pm.expect(pm.response.json().error).to.eql('ID de consumo deve ser numérico');
      });
    language: text/javascript
order: 8503
