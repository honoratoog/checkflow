$kind: http-request
url: "{{baseUrl}}/consumos/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('Mensagem de consumo não encontrado', () => {
          pm.expect(pm.response.json().error).to.eql('Consumo não encontrado');
      });
    language: text/javascript
order: 8502
