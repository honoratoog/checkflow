$kind: http-request
url: "{{baseUrl}}/reservas/{{reservaMinibarId}}/consumos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "item": "",
      "quantidade": 0,
      "valor_unitario": -5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Retorna mensagem de erro de validação', () => {
          pm.expect(pm.response.json().error).to.be.a('string');
      });
    language: text/javascript
order: 8300
